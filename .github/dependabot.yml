# Weekly update PRs for GitHub Actions and Python dependencies (uv.lock).
# PR titles follow Conventional Commits (see CONTRIBUTING.md): "ci(deps): ..." / "build(deps): ...".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels: ["ci"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels: ["build"]
    groups:
      python:
        patterns: ["*"]
