# Publishes the docs website to GitHub Pages: https://lawkeep.github.io/lawkeep/
#
# - the user documentation, built with Sphinx (Furo theme, MyST Markdown) from docs/site/, at the
#   site root, with warnings as errors; every page is also written next to its HTML as Markdown
#   (concepts/laws.html -> concepts/laws.md) for LLMs (see docs/site/conf.py);
# - the LLM-friendly docs at the root (llms.txt convention, https://llmstxt.org): llms.txt and
#   llms-full.txt, generated by scripts/build_llms_docs.py and committed under docs/;
# - the internal onboarding guide for contributors at /contributing/onboarding.html (and as
#   Markdown at /contributing/onboarding.md), with a link back to the docs added to its sidebar;
#   /onboarding.html (the old address) redirects there;
# - Markdown copies of PLAN, ARCHITECTURE, OUTPUT-STYLE, README, CHANGELOG and CONTRIBUTING.
name: pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - src/lawkeep/adapters/templates/agents_snippet.md
      - pyproject.toml
      - uv.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install Sphinx and the docs tools
        run: uv sync --locked --group docs
      - name: Build the user docs (warnings are errors)
        run: uv run sphinx-build -W --keep-going -b html docs/site _site
      - name: Add the LLM docs, the onboarding guide and Markdown copies
        run: |
          rm -rf _site/_sources _site/.doctrees
          cp docs/llms.txt docs/llms-full.txt _site/
          mkdir -p _site/contributing
          python3 - <<'PY'
          from pathlib import Path

          page = Path("docs/onboarding.html").read_text(encoding="utf-8")
          marker = '<div class="brand">lawkeep onboarding</div>'
          assert page.count(marker) == 1, "sidebar marker not found in docs/onboarding.html"
          links = [
              ("User documentation", "../index.html"),
              ("Contributing", "index.html"),
              ("CONTRIBUTING.md", "https://github.com/lawkeep/lawkeep/blob/main/CONTRIBUTING.md"),
              ("Good first issues", "https://github.com/lawkeep/lawkeep/labels/good%20first%20issue"),
              ("This guide as Markdown", "onboarding.md"),
          ]
          items = "".join(f'<li><a href="{url}">{text}</a></li>' for text, url in links)
          extra = (
              f'<ol aria-label="Project links" style="margin-bottom:14px;padding-bottom:10px;'
              f'border-bottom:1px solid var(--border)">{items}</ol>'
          )
          out = Path("_site/contributing/onboarding.html")
          out.write_text(page.replace(marker, marker + extra), encoding="utf-8")
          redirect = (
              '<!doctype html><meta charset="utf-8"><title>Moved</title>'
              '<link rel="canonical" href="contributing/onboarding.html">'
              '<meta http-equiv="refresh" content="0; url=contributing/onboarding.html">'
              '<p>The onboarding guide moved to <a href="contributing/onboarding.html">'
              "contributing/onboarding.html</a>.</p>\n"
          )
          Path("_site/onboarding.html").write_text(redirect, encoding="utf-8")
          PY
          cp docs/onboarding.md _site/contributing/onboarding.md
          cp docs/PLAN.md docs/ARCHITECTURE.md docs/OUTPUT-STYLE.md README.md CHANGELOG.md CONTRIBUTING.md _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy docs site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
