# Checks that pull request titles follow Conventional Commits (the title becomes the squash
# commit on main). Types and rules: CONTRIBUTING.md → "Commit messages".
name: pr title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Summary: lowercase start, no full stop at the end.
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The summary "{subject}" in "{title}" must start with a lowercase letter and must not
            end with a full stop (see CONTRIBUTING.md → "Commit messages").
