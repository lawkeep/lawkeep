# CI for lawkeep itself: tests, lint, both example projects through the real gate, and the
# lawkeep GitHub Action run against an example (a self-test of action.yml).
#
# On pull requests, the first job ("changes") lists the files the pull request changes, and the
# other jobs skip themselves with a job-level `if:` when nothing they check was touched:
#   code         -> tests (3 Pythons), example projects through the gate, lawkeep action self-test
#   docs         -> docs site
#   code or docs -> lint (ruff, pyright and the generated-docs drift check, which reads both)
# A job skipped by `if:` reports "Skipped", which satisfies a required status check. Never use
# workflow-level `paths:` / `paths-ignore:` here: required checks would then wait forever.
# Pushes to main and manual runs run everything. If the file list cannot be made, everything runs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2 # GitHub's merge commit for the PR and its first parent (the base)
          persist-credentials: false
      - name: Which kinds of files the change touches
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # Keep both lists in step with .github/workflows/AGENTS.md and CONTRIBUTING.md.
          code='^(src/|tests/|examples/|laws/|scripts/|\.github/workflows/)|^(lawkeep\.toml|laws\.lock|pyproject\.toml|uv\.lock|action\.yml|\.pre-commit-config\.yaml)$'
          # docs: the docs, plus everything the docs build and scripts/build_llms_docs.py read.
          docs='^(docs/|src/|scripts/|\.github/workflows/)|^(README\.md|CHANGELOG\.md|CONTRIBUTING\.md|SECURITY\.md|action\.yml|pyproject\.toml|uv\.lock)$'
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request ($EVENT): run everything."
            { echo "code=true"; echo "docs=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout is GitHub's merge commit: HEAD^1 is the base branch, so this lists exactly
          # what merging the pull request would change.
          if ! changed=$(git diff --name-only HEAD^1 HEAD); then
            echo "::warning::Could not list the changed files: running every job."
            { echo "code=true"; echo "docs=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'
          for kind in code docs; do
            if grep -Eq "${!kind}" <<< "$changed"; then hit=true; else hit=false; fi
            echo "$kind=$hit" | tee -a "$GITHUB_OUTPUT"
          done

  # One job per Python version, not a matrix: a matrix job skipped by `if:` reports a single check
  # named "tests (Python ${{ matrix.python-version }})" (seen on GitHub, 2026-11-24), so the
  # required checks "tests (Python 3.10)" etc. would never report. The steps are shared with a
  # YAML anchor; only the job id, name and PYTHON_VERSION differ.
  test-py310:
    name: tests (Python 3.10)
    needs: changes
    # Skipped only when the "changes" job says no code changed (a failed "changes" job runs it).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.10"
    steps: &test-steps
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: uv sync --all-extras
      - name: Tests (including the cheating test suite in tests/tamper)
        run: uv run pytest -q -rxX

  test-py312:
    name: tests (Python 3.12)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
    steps: *test-steps

  test-py313:
    name: tests (Python 3.13)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13"
    steps: *test-steps

  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.code != 'false' || needs.changes.outputs.docs != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-extras  # --locked: fail if uv.lock is out of date
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      # Type check: src/lawkeep in strict mode, tests in standard mode (see [tool.pyright] in
      # pyproject.toml). `uv run` uses the pyright version pinned in uv.lock.
      - name: Type check (pyright)
        run: uv run pyright
      # docs/llms.txt, docs/llms-full.txt, docs/onboarding.md and the generated pages in
      # docs/site/reference/ come from the CLI parsers, action.yml, the agent instructions template
      # and the docs: fail when they are out of date.
      - name: Generated docs are up to date
        run: uv run python scripts/build_llms_docs.py --check

  docs:
    name: docs site
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --group docs
      # The public docs website (docs/site/, Sphinx + Furo + MyST): warnings are errors, so a
      # broken link between pages or a bad directive fails the pull request.
      - name: Build the docs website
        run: uv run sphinx-build -W --keep-going -b html docs/site _build/site
      # Outside links can be down for reasons unrelated to the change: report, never fail.
      - name: Check outside links (does not fail the job)
        continue-on-error: true
        run: uv run sphinx-build -q -b linkcheck docs/site _build/linkcheck

  examples:
    name: example projects through the gate
    needs: changes
    # Skipped only when the "changes" job says no code changed (a failed "changes" job runs it).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Both examples pass lawkeep check
        run: |
          set -euo pipefail
          for ex in billing bookings; do
            echo "::group::examples/$ex"
            uv run lawkeep check --root "examples/$ex"
            echo "::endgroup::"
          done
      - name: Each planted bug fails the gate with a small failing input
        run: |
          set -uo pipefail
          for ex in billing bookings; do
            work="$RUNNER_TEMP/$ex"
            cp -r "examples/$ex" "$work"
            (cd "$work" && git apply planted_bug.patch)
            # The planted bug must make the gate fail (exit 1). GitHub runs steps with `bash -e`,
            # so capture the expected non-zero code instead of letting the shell stop here.
            code=0
            uv run lawkeep check --json --root "$work" > "$RUNNER_TEMP/$ex.json" || code=$?
            uv run python - "$RUNNER_TEMP/$ex.json" "$code" <<'PY'
          import json, sys
          report, code = json.load(open(sys.argv[1])), int(sys.argv[2])
          failing = [law for law in report["laws"] if law["status"] == "fails"]
          print(report["summary"])
          for law in failing:
              print(f"  FAIL {law['law_id']}: simplest failing example {law['simplest_failing_example']}")
          assert code == 1, f"expected result code 1 (some laws fail), got {code}"
          assert failing and all(law["simplest_failing_example"] for law in failing)
          PY
          done

  action-self-test:
    name: lawkeep action on examples/billing
    needs: changes
    # Skipped only when the "changes" job says no code changed (a failed "changes" job runs it).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run the action from this checkout
        id: lawkeep
        uses: ./
        with:
          working-directory: examples/billing
          lawkeep-spec: ${{ github.workspace }}
          install-project: "false"
          comment: "false"
      - name: The action reports ALL LAWS HOLD for the example
        env:
          CODE: ${{ steps.lawkeep.outputs.result-code }}
          VERDICT: ${{ steps.lawkeep.outputs.verdict }}
        run: |
          echo "result-code=$CODE verdict=$VERDICT"
          test "$CODE" = "0"
