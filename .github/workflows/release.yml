# Release lawkeep to PyPI when a version tag (v0.1.0, v0.2.0, ...) is pushed.
#
# How it works:
#   1. "build" checks out the tag, runs lint, type checks and the whole test suite, checks that
#      the tag matches lawkeep.__version__, builds the wheel and sdist, and checks them.
#   2. "publish" uploads them to PyPI with trusted publishing: PyPI trusts this workflow directly,
#      so no token is stored anywhere. One-time setup on pypi.org (project lawkeep -> Publishing ->
#      add a GitHub publisher): owner "lawkeep", repository "lawkeep", workflow "release.yml",
#      environment "pypi".
#   3. "github-release" creates a GitHub release for the tag with the built files attached.
#   4. "move major tag" moves the moving major tag (v0 for 0.x) to the released commit, for final
#      releases only (X.Y.Z; never a, b or rc) and only when this is the newest final release of
#      that major version, so users of `lawkeep/lawkeep@v0` get it. `v0` itself never starts this
#      workflow: the trigger only matches tags with three version parts (v*.*.*).
#
# To release: follow CONTRIBUTING.md → "Versions, tags and releases" (bump __version__, move the
# CHANGELOG.md "Unreleased" section to the new version, merge, then
# `git tag -a v<version> -m "lawkeep <version>" && git push origin v<version>`).
# Release notes are this version's section of CHANGELOG.md; a, b and rc versions are pre-releases.
name: release

on:
  push:
    # Real version tags only (v0.1.0, v0.2.0rc1, ...): the moving major tag v0 must not match.
    tags: ["v*.*.*"]
  workflow_dispatch: # re-run the build checks by hand (publishing still needs a tag)

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --all-extras
      - name: Lint and type check
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pyright
      - name: Tests
        run: uv run pytest -q
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv run python -c "import lawkeep; print(lawkeep.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match lawkeep.__version__ ($version)." >&2
            exit 1
          fi
      - name: Build
        run: uv build
      - name: Check the built files
        run: |
          uvx twine check --strict dist/*
          unzip -l dist/*.whl | grep -q "lawkeep/py.typed"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lawkeep/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true # re-running a release (or v0.1.0, uploaded by hand) is safe

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes = this version's section of CHANGELOG.md (Keep a Changelog format).
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md for what changed." > notes.md; fi
          prerelease=""
          case "$version" in *a*|*b*|*rc*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "lawkeep $GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease

  move-major-tag:
    name: move major tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every tag, to find the newest release
      - name: Move v<major> to this release
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # Final releases only: a, b, rc (and dev/post) versions leave the major tag alone.
          if ! [[ "$tag" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "$tag is not a final X.Y.Z release: the major tag stays where it is."
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          # Only the newest final release of this major version moves it (a later fix for an
          # older minor version, such as 0.1.3 after 0.2.0, must not move v0 back).
          newest=$(git tag -l "$major.*.*" | grep -E "^$major\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)
          if [ "$newest" != "$tag" ]; then
            echo "$newest is newer than $tag: $major stays where it is."
            exit 0
          fi
          commit=$(git rev-parse "$tag^{commit}")
          current=$(git rev-parse -q --verify "refs/tags/$major^{commit}" || true)
          if [ "$current" = "$commit" ]; then
            echo "$major already points at $tag ($commit): nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$major" -m "lawkeep $major (moving major tag; currently $tag)" "$commit"
          git push --force origin "refs/tags/$major"
          echo "Moved $major from ${current:-nothing} to $tag ($commit)."
