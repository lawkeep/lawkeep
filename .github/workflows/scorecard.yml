# OpenSSF Scorecard: supply-chain security checks. Results go to the Security tab and the public
# Scorecard API (the badge in README.md). With publish_results, the job may only use the
# actions Scorecard allows, and the workflow must not set top-level env or defaults.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
