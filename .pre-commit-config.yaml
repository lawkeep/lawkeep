# Install once with `uv run pre-commit install` (see CONTRIBUTING.md). This replaces
# .git/hooks/pre-commit, so the last hook below runs lawkeep's own pre-commit check, the same one
# `lawkeep init` installs.
#
# laws/, examples/*/laws/ and laws.lock are fingerprinted by lawkeep: no hook may rewrite them
# (a rewritten byte would show up as an unrecorded law change). They are excluded globally.
exclude: ^(laws/|laws\.lock$|examples/[^/]+/laws/|examples/[^/]+/laws\.lock$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # Planted-bug patches must stay byte-for-byte as they are, or `git apply` fails.
        exclude: \.patch$
      - id: end-of-file-fixer
        exclude: \.patch$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        files: ^(src|tests)/
      - id: ruff-format
        files: ^(src|tests)/

  - repo: local
    hooks:
      - id: lawkeep
        name: lawkeep pre-commit check (law changes outside lawkeep)
        entry: uv run lawkeep hook pre-commit
        language: system
        pass_filenames: false
        always_run: true
        verbose: true  # show its notes even when it does not stop the commit, like the plain git hook
